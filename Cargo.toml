[workspace]
resolver = "3"
members = [
    "crates/oxy-ecore",
    "crates/oxy-ocl",
    "crates/oxy-henshin",
    "crates/oxy-qvt",
    "crates/oxy-codegen",
    "crates/oxychloride",
    "crates/oxy-cli",
    "crates/oxy-ffi",
    "crates/oxy-lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/palladio/oxychloride"
rust-version = "1.85"

[workspace.dependencies]
oxy-ecore = { path = "crates/oxy-ecore" }
oxy-ocl = { path = "crates/oxy-ocl" }
oxy-henshin = { path = "crates/oxy-henshin" }
oxy-qvt = { path = "crates/oxy-qvt" }
oxy-codegen = { path = "crates/oxy-codegen" }
oxychloride = { path = "crates/oxychloride" }
oxy-lsp = { path = "crates/oxy-lsp" }
quick-xml = "0.42"
indexmap = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
stacker = "0.1"
miniz_oxide = "0.8"
