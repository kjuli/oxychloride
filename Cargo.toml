[workspace]
resolver = "3"
members = [
    "crates/oxy-ecore",
    "crates/oxy-ocl",
    "crates/oxychloride",
    "crates/oxy-cli",
    "crates/oxy-ffi",
    "crates/oxy-lsp",
    "app/src-tauri",
]
# The desktop app pulls in a large dependency tree; keep plain `cargo build`/`cargo test` fast.
default-members = [
    "crates/oxy-ecore",
    "crates/oxy-ocl",
    "crates/oxychloride",
    "crates/oxy-cli",
    "crates/oxy-ffi",
    "crates/oxy-lsp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/palladio/oxychloride"
rust-version = "1.85"

[workspace.dependencies]
oxy-ecore = { path = "crates/oxy-ecore" }
oxy-ocl = { path = "crates/oxy-ocl" }
oxychloride = { path = "crates/oxychloride" }
oxy-lsp = { path = "crates/oxy-lsp" }
quick-xml = "0.42"
indexmap = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
